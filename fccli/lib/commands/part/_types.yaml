# Tuning for a Part type with no command of its own, so no command file
# can carry it (ADR-100 option A). Keyed by type, read at compile like
# std/_families.yaml. Box, Cylinder, Sphere, Cone and Torus carry theirs
# on their Part_* command files; these two have no command.
types:
  Part::Wedge:
    steps: [Xmin, Ymin, Zmin, Xmax, Ymax, Zmax]
    strict: true
  Part::Helix:
    steps: [Pitch, Height, Radius]
    options: [Angle, LocalCoord, Style]
    strict: true
